<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIM SATRIA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>:root{--g:#0b3d2e;--g2:#1b5e20;--bg:#f4fff8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif}.app{min-height:100vh}.sidebar{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid #e5eee8}.brand{background:linear-gradient(135deg,var(--g),#2e7d32);color:#fff}.content{min-width:0}.navbtn{border:0;background:transparent;width:100%;text-align:left;padding:11px 14px;border-radius:10px}.navbtn:hover,.navbtn.active{background:#eaf7ee;color:var(--g2)}.card{border:0;box-shadow:0 8px 25px rgba(11,61,46,.08)}.card-header{background:linear-gradient(135deg,var(--g),#66bb6a);color:#fff}.table-wrap{overflow:auto}.login-wrap{min-height:100vh;display:grid;place-items:center}.login-card{width:min(420px,92vw)}.mobile-head{display:none}.master-select{min-width:150px}.table th{white-space:nowrap}.table td{vertical-align:middle}.loading-row{padding:35px!important}.user-relation-note,.builder-help{background:#f4fff8;border:1px solid #d7eee0;border-radius:12px;padding:10px 12px}.required-star{color:#dc3545}.column-card{border:1px solid #dcece2;border-radius:14px;background:#fff;padding:12px}.column-card small{font-size:.78rem}@media(max-width:900px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:1050;transition:left .2s;box-shadow:5px 0 25px rgba(0,0,0,.12)}.sidebar.open{left:0}.mobile-head{display:flex}.content{width:100%}.master-head{gap:8px;flex-wrap:wrap}.master-select{width:100%;min-width:0}}</style></head><body>
<div id="loginView" class="login-wrap"><div class="card login-card"><div class="card-body p-4"><h3 class="fw-bold mb-1">SIM SATRIA</h3><div class="text-muted mb-4">Class Builder</div><div id="loginErr" class="alert alert-danger d-none"></div><input id="username" class="form-control mb-2" placeholder="Username"><input id="password" type="password" class="form-control mb-3" placeholder="Password"><button id="loginBtn" class="btn btn-success w-100" onclick="doLogin()">Masuk</button></div></div></div>
<div id="appView" class="app d-flex d-none"><aside id="sidebar" class="sidebar p-3"><div class="brand rounded-4 p-3 mb-3"><div class="fw-bold">SIM SATRIA</div><small>Web App Builder</small></div><div id="userBox" class="small text-muted mb-3"></div><div id="menuList"></div><hr><button class="navbtn text-danger" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button></aside><main class="content flex-grow-1"><div class="mobile-head p-2 bg-white border-bottom sticky-top"><button class="btn btn-light" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><span class="ms-2 fw-semibold">SIM SATRIA</span></div><div class="container-fluid p-3 p-lg-4"><div id="page"></div></div></main></div>
<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 id="dataModalTitle" class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="dataModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button id="dataSaveBtn" class="btn btn-success" onclick="saveMaster()">Simpan</button></div></div></div></div>
<div class="modal fade" id="menuModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Menu Builder</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="menuModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMenu()">Simpan</button></div></div></div></div>
<div class="modal fade" id="studentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Data Siswa</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="studentModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveStudent()">Simpan</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const state={session:null,menus:[],entity:'USERS',rows:[],menuRows:[],studentRows:[],editingIndex:-1,kelasOptions:null,userRelations:null,builder:{kelasId:'',sheet:'',columns:[]}};
const masterMeta={USERS:{label:'Pengguna',cols:['username','nama','role','kelas_id','status']},GURU:{label:'Guru',cols:['nip','nama','status']},KARYAWAN:{label:'Karyawan',cols:['nik','nama','status']},SISWA:{label:'Siswa',cols:['nisn','nama','kelas_id','status']},KELAS:{label:'Kelas',cols:['kode','nama','sheet_name','spreadsheet_id','admin_user_id','status']},MAPEL:{label:'Mapel',cols:['kode','nama','status']}};
const roleOptions=['OWNER','ADMIN_KELAS','GURU','KARYAWAN','SISWA'];
function gas(fn,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error('google.script.run tidak tersedia.'));google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e||new Error('Server tidak mengembalikan respons.')))[fn](...args)})}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function errorText(e){return String(e?.message||e||'Terjadi kesalahan').replace(/^Exception:\s*/,'').replace(/^Error:\s*/,'')}function show(id,on){document.getElementById(id)?.classList.toggle('d-none',!on)}function setLoginError(s){const e=document.getElementById('loginErr');e.textContent=s||'';e.classList.toggle('d-none',!s)}
async function doLogin(){const b=document.getElementById('loginBtn');b.disabled=true;setLoginError('');try{const r=await gas('login',document.getElementById('username').value.trim(),document.getElementById('password').value);if(!r?.ok)throw new Error(r?.message||'Username atau password salah.');state.session=r.user;state.menus=Array.isArray(r.menus)?r.menus:[];await gas('setActiveToken',r.token);enterApp()}catch(e){setLoginError(errorText(e))}finally{b.disabled=false}}async function boot(){try{const r=await gas('getAppState');if(r?.authenticated&&r.session){state.session=r.session;state.menus=Array.isArray(r.menus)?r.menus:[];enterApp()}}catch(e){console.debug(e)}}
function enterApp(){show('loginView',false);show('appView',true);document.getElementById('userBox').innerHTML='<b>'+esc(state.session.nama)+'</b><br>'+esc(state.session.role)+(state.session.kelas_id?'<br>Kelas: '+esc(state.session.kelas_id):'');renderMenus();renderHome()}function renderMenus(){const role=state.session.role;let h=(Array.isArray(state.menus)?state.menus:[]).map((m,i)=>'<button class="navbtn" onclick="openMenu('+i+')"><i class="bi '+esc(m.icon||'bi-grid')+' me-2"></i>'+esc(m.label||m.key)+'</button>').join('');if(role==='OWNER')h+='<hr><button class="navbtn" onclick="renderMaster()"><i class="bi bi-database me-2"></i>MASTER</button><button class="navbtn" onclick="renderMenuBuilder()"><i class="bi bi-list-task me-2"></i>Menu Builder</button>';if(role==='ADMIN_KELAS')h+='<hr><button class="navbtn" onclick="renderClassAdmin()"><i class="bi bi-people me-2"></i>Kelola Kelas</button>';document.getElementById('menuList').innerHTML=h}function renderHome(){document.getElementById('page').innerHTML='<div class="card"><div class="card-body"><h4 class="fw-bold mb-1">Selamat datang</h4><div class="text-muted">'+esc(state.session.nama)+' · '+esc(state.session.role)+'</div></div></div>'}function openMenu(i){const m=state.menus[i];if(!m)return;if(m.key==='7kaih')return render7KAIH();const fn=String(m.handler||'');if(typeof window[fn]==='function')return window[fn](m);document.getElementById('page').innerHTML='<div class="alert alert-warning">Handler <code>'+esc(fn)+'</code> belum tersedia.</div>'}function render7KAIH(){const a=['Bangun Pagi','Beribadah','Berolahraga','Makan Sehat','Gemar Belajar','Bermasyarakat','Tidur Cepat'];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><h5 class="mb-0">7KAIH</h5></div><div class="card-body"><div class="row g-3">'+a.map((x,i)=>'<div class="col-sm-6 col-lg-4"><div class="p-3 border rounded-4"><b>'+(i+1)+'. '+x+'</b><small class="d-block text-muted">Modul 7 Kebiasaan Anak Indonesia Hebat</small></div></div>').join('')+'</div></div></div>'}function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open')}async function doLogout(){try{await gas('logout')}catch(e){}location.reload()}
function renderMasterShell(){document.getElementById('page').innerHTML='<div class="card"><div class="card-header master-head d-flex justify-content-between align-items-center"><div><h5 class="mb-0">MASTER</h5><small>Pengaturan data utama sistem</small></div><select id="masterEntity" class="form-select form-select-sm master-select" onchange="loadMaster()">'+Object.entries(masterMeta).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('')+'</select></div><div class="card-body"><div class="d-flex flex-wrap gap-2 mb-3"><button id="addMasterBtn" class="btn btn-success" onclick="newMasterRow()"><i class="bi bi-plus-lg me-1"></i>Tambah</button><button id="refreshMasterBtn" class="btn btn-outline-secondary" onclick="loadMaster()">Refresh</button></div><div id="masterMsg"></div><div class="table-wrap"><table class="table table-hover align-middle mb-0"><thead id="masterHead"></thead><tbody id="masterBody"></tbody></table></div></div></div>'}async function renderMaster(){renderMasterShell();await loadMaster()}function setMasterBusy(b){['addMasterBtn','refreshMasterBtn'].forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=b})}
async function loadMaster(){const sel=document.getElementById('masterEntity');if(!sel)return;state.entity=sel.value;const meta=masterMeta[state.entity],head=document.getElementById('masterHead'),body=document.getElementById('masterBody');head.innerHTML='<tr>'+meta.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th class="text-end">Aksi</th></tr>';body.innerHTML='<tr><td colspan="99" class="text-center text-muted loading-row"><div class="spinner-border spinner-border-sm me-2"></div>Memuat...</td></tr>';setMasterBusy(true);try{const result=await gas('getMasterRows',state.entity);state.rows=Array.isArray(result)?result:[];if(state.entity==='KELAS')state.kelasOptions=state.rows.filter(r=>String(r?.status||'AKTIF').toUpperCase()!=='NONAKTIF');if(!state.rows.length){body.innerHTML='<tr><td colspan="99" class="text-center text-muted py-5">Belum ada data.</td></tr>';return}body.innerHTML=state.rows.map((r,i)=>'<tr>'+meta.cols.map(c=>'<td>'+esc(r?.[c])+'</td>').join('')+'<td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="editMaster('+i+')">Edit</button><button class="btn btn-sm btn-outline-danger" onclick="delMaster('+i+')">Hapus</button>'+(state.entity==='KELAS'?'<button class="btn btn-sm btn-outline-success ms-1" onclick="openClassSheetBuilder('+i+')"><i class="bi bi-table"></i> Sheet Kegiatan</button>':'')+'</td></tr>').join('')}catch(e){body.innerHTML='<tr><td colspan="99"><div class="alert alert-danger">'+esc(errorText(e))+'</div></td></tr>'}finally{setMasterBusy(false)}}
async function loadKelasOptions(){if(Array.isArray(state.kelasOptions))return state.kelasOptions;const rows=await gas('getMasterRows','KELAS');state.kelasOptions=(Array.isArray(rows)?rows:[]).filter(r=>String(r?.status||'AKTIF').toUpperCase()!=='NONAKTIF');return state.kelasOptions}async function loadUserRelations(){if(state.userRelations)return state.userRelations;const r=await gas('getUserRelationOptions');state.userRelations={guru:Array.isArray(r?.guru)?r.guru:[],karyawan:Array.isArray(r?.karyawan)?r.karyawan:[],siswa:Array.isArray(r?.siswa)?r.siswa:[],kelas:Array.isArray(r?.kelas)?r.kelas:[]};return state.userRelations}function relationLabel(r,type){if(type==='guru')return(r.nip?r.nip+' — ':'')+(r.nama||'');if(type==='karyawan')return(r.nik?r.nik+' — ':'')+(r.nama||'');if(type==='siswa')return(r.nisn?r.nisn+' — ':'')+(r.nama||'')+(r.kelas_id?' ('+r.kelas_id+')':'');return(r.kode?r.kode+' — ':'')+(r.nama||'')}
async function openUserModal(i,r){state.editingIndex=i;const isNew=i<0,role=String(r.role||'OWNER');let html='<input type="hidden" data-f="id" value="'+esc(r.id||'')+'"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Jenis Pengguna</label><select class="form-select" id="userRole" data-f="role" onchange="refreshUserRoleFields()">'+roleOptions.map(x=>'<option value="'+x+'" '+(role===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="col-md-6"><label class="form-label fw-semibold">Username</label><input class="form-control" data-f="username" value="'+esc(r.username||'')+'"></div><div class="col-md-6"><label class="form-label fw-semibold">Nama</label><input class="form-control" id="userNama" data-f="nama" value="'+esc(r.nama||'')+'"></div><div class="col-md-6"><label class="form-label fw-semibold">Status</label><select class="form-select" data-f="status"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div><div class="col-12" id="userRelationFields"></div><div class="col-md-6"><label class="form-label fw-semibold">Password</label><input type="password" class="form-control" data-f="password"></div></div>';document.getElementById('dataModalTitle').textContent=(isNew?'Tambah ':'Edit ')+'Pengguna';document.getElementById('dataModalBody').innerHTML=html;await refreshUserRoleFields(r);new bootstrap.Modal(document.getElementById('dataModal')).show()}async function refreshUserRoleFields(oldRow){const role=document.getElementById('userRole')?.value||'OWNER',box=document.getElementById('userRelationFields');if(!box)return;const old=oldRow||{};let type=null,field=null;if(role==='GURU'){type='guru';field='guru_id'}if(role==='KARYAWAN'){type='karyawan';field='karyawan_id'}if(role==='SISWA'){type='siswa';field='siswa_id'}if(role==='ADMIN_KELAS'){type='kelas';field='kelas_id'}if(!type){box.innerHTML='<div class="user-relation-note small text-muted">OWNER tidak memiliki relasi.</div>';return}const rel=await loadUserRelations(),list=rel[type]||[],current=String(old[field]||'');box.innerHTML='<label class="form-label fw-semibold">'+(type==='guru'?'Pilih Guru':type==='karyawan'?'Pilih Karyawan':type==='siswa'?'Pilih Siswa':'Pilih Kelas')+'</label><select class="form-select" id="userRelation" data-user-relation="1" data-rel-field="'+field+'" onchange="syncUserIdentity()"><option value="">-- Pilih --</option>'+list.map(x=>'<option value="'+esc(x.id)+'" '+(current===String(x.id)?'selected':'')+'>'+esc(relationLabel(x,type))+'</option>').join('')+'</select><div class="user-relation-note small text-muted mt-2">Relasi diambil langsung dari MASTER.</div>';syncUserIdentity()}async function syncUserIdentity(){const role=document.getElementById('userRole')?.value,sel=document.getElementById('userRelation'),nama=document.getElementById('userNama');if(!nama)return;const id=sel?.value||'',rel=await loadUserRelations();let item=null;if(role==='GURU')item=rel.guru.find(x=>String(x.id)===String(id));if(role==='KARYAWAN')item=rel.karyawan.find(x=>String(x.id)===String(id));if(role==='SISWA')item=rel.siswa.find(x=>String(x.id)===String(id));if(role==='ADMIN_KELAS')item=rel.kelas.find(x=>String(x.id)===String(id));if(role!=='OWNER')nama.value=item?.nama||'';nama.readOnly=role==='GURU'||role==='KARYAWAN'||role==='SISWA'}
async function inputFor(c,v){const val=esc(v);if(c==='role')return '<select class="form-select" data-f="role">'+roleOptions.map(x=>'<option value="'+x+'">'+x+'</option>').join('');if(c==='status')return '<select class="form-select" data-f="status"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select>';if(state.entity==='SISWA'&&c==='kelas_id'){const kelas=await loadKelasOptions();return '<select class="form-select" data-f="kelas_id"><option value="">-- Pilih Kelas --</option>'+kelas.map(r=>'<option value="'+esc(r.kode)+'" '+(String(v||'')===String(r.kode)?'selected':'')+'>'+esc(r.kode+' — '+r.nama)+'</option>').join('')+'</select>'}return '<input class="form-control" data-f="'+c+'" value="'+val+'">'}async function newMasterRow(){await openMasterModal(-1)}async function editMaster(i){await openMasterModal(i)}async function openMasterModal(i){if(!masterMeta[state.entity])return;const r=i<0?{}:(state.rows[i]||{}),meta=masterMeta[state.entity];if(state.entity==='USERS')return openUserModal(i,r);state.editingIndex=i;let html='<input type="hidden" data-f="id" value="'+esc(r.id||'')+'"><div class="row g-2">';for(const c of meta.cols)html+='<div class="col-md-6"><label class="form-label small fw-semibold">'+esc(c)+'</label>'+await inputFor(c,r[c])+'</div>';html+='</div>';document.getElementById('dataModalTitle').textContent=(i<0?'Tambah ':'Edit ')+meta.label;document.getElementById('dataModalBody').innerHTML=html;new bootstrap.Modal(document.getElementById('dataModal')).show()}
async function saveMaster(){const modal=document.getElementById('dataModal'),btn=document.getElementById('dataSaveBtn'),d={};modal.querySelectorAll('[data-f]').forEach(x=>{if(x.dataset.f==='password'&&!x.value)return;d[x.dataset.f]=x.value});if(state.entity==='USERS'){const role=d.role||'',sel=document.getElementById('userRelation');if(role==='GURU')d.guru_id=sel?.value||'';if(role==='KARYAWAN')d.karyawan_id=sel?.value||'';if(role==='SISWA')d.siswa_id=sel?.value||'';if(role==='ADMIN_KELAS')d.kelas_id=sel?.value||'';if(role==='OWNER'){d.guru_id='';d.karyawan_id='';d.siswa_id='';d.kelas_id=''}}btn.disabled=true;try{const r=await gas('saveMasterRow',state.entity,d);if(!r?.ok)throw new Error(r?.message||'Gagal menyimpan.');bootstrap.Modal.getInstance(modal)?.hide();state.userRelations=null;await loadMaster()}catch(e){alert('Gagal menyimpan: '+errorText(e))}finally{btn.disabled=false}}
async function delMaster(i){const r=state.rows[i];if(!r?.id)return;if(!confirm('Hapus data '+(r.nama||r.username||r.nip||r.nik||r.nisn||r.kode||'ini')+'?'))return;try{await gas('deleteMasterRow',state.entity,r.id);state.userRelations=null;await loadMaster()}catch(e){alert('Gagal menghapus: '+errorText(e))}}
async function renderMenuBuilder(){try{const x=await gas('getMenuBuilder');state.menuRows=Array.isArray(x)?x:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><div><h5 class="mb-0">Menu Builder</h5><small>Hanya OWNER</small></div><button class="btn btn-light btn-sm" onclick="editMenu(-1)">+ Menu</button></div><div class="card-body table-wrap"><table class="table"><thead><tr><th>Key</th><th>Label</th><th>Handler</th><th>Roles</th><th>Aktif</th><th></th></tr></thead><tbody>'+state.menuRows.map((r,i)=>'<tr><td>'+esc(r.key)+'</td><td>'+esc(r.label)+'</td><td>'+esc(r.handler)+'</td><td>'+esc(r.roles)+'</td><td>'+esc(r.active)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editMenu('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}function editMenu(i){const r=i<0?{}:(state.menuRows[i]||{}),fs=['id','key','label','icon','handler','urutan','roles','active','config_json'];document.getElementById('menuModalBody').innerHTML=fs.map(f=>'<div class="mb-2"><label class="form-label small">'+f+'</label><input class="form-control" data-mf="'+f+'" value="'+esc(r[f]??'')+'"></div>').join('');new bootstrap.Modal(document.getElementById('menuModal')).show()}async function saveMenu(){const d={};document.querySelectorAll('#menuModal [data-mf]').forEach(x=>d[x.dataset.mf]=x.value);d.active=String(d.active).toLowerCase()!=='false';try{await gas('saveMenu',d);bootstrap.Modal.getInstance(document.getElementById('menuModal'))?.hide();await renderMenuBuilder()}catch(e){alert('Gagal menyimpan menu: '+errorText(e))}}

async function openClassSheetBuilder(i){const r=state.rows[i];if(!r?.id)return;state.builder.kelasId=r.id;state.builder.sheet='';state.builder.columns=[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><div class="d-flex justify-content-between align-items-center"><div><h5 class="mb-0">Spreadsheet Kelas</h5><small>Konfigurasi sheet kegiatan siswa — '+esc(r.nama||r.kode)+'</small></div><button class="btn btn-light btn-sm" onclick="renderMaster()">Kembali</button></div></div><div class="card-body"><div id="sheetConfigArea">Memuat...</div></div></div>';await renderClassSpreadsheetConfig()}
async function renderClassSpreadsheetConfig(){const r=state.rows.find(x=>String(x.id)===String(state.builder.kelasId))||{};document.getElementById('sheetConfigArea').innerHTML='<div class="builder-help mb-3"><b>1. ID Spreadsheet Kelas</b><br><small>Masukkan ID Google Spreadsheet yang akan menjadi database kegiatan siswa. Contoh: bagian setelah <code>/d/</code> pada URL spreadsheet.</small></div><div class="input-group mb-3"><input id="classSpreadsheetId" class="form-control" value="'+esc(r.spreadsheet_id||'')+'" placeholder="ID Spreadsheet Kelas"><button class="btn btn-success" onclick="saveClassSpreadsheetUI()">Simpan & Render Sheet</button></div><div id="sheetArea"></div>';if(r.spreadsheet_id)await renderActivitySheets()}
async function saveClassSpreadsheetUI(){const id=document.getElementById('classSpreadsheetId').value.trim();if(!id)return alert('ID Spreadsheet wajib diisi.');try{const x=await gas('saveClassSpreadsheet',state.builder.kelasId,id);const row=state.rows.find(r=>String(r.id)===String(state.builder.kelasId));if(row)row.spreadsheet_id=x.spreadsheet_id;await renderActivitySheets()}catch(e){alert('Spreadsheet tidak dapat dibuka: '+errorText(e))}}
async function renderActivitySheets(){const box=document.getElementById('sheetArea');box.innerHTML='<div class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Membaca daftar sheet...</div>';try{const x=await gas('getClassSpreadsheetSheets',state.builder.kelasId);box.innerHTML='<div class="builder-help mb-3"><b>2. Pilih sheet kegiatan</b><br><small>Semua sheet yang ada di spreadsheet tersebut ditampilkan. Pilih misalnya <code>TRX_7KAIH</code> untuk membuat/menyusun headernya.</small></div><div class="row g-2">'+x.sheets.map(s=>'<div class="col-md-6 col-xl-4"><button class="btn btn-outline-success w-100 text-start p-3" onclick="openActivitySheet(\''+esc(s.name).replace(/'/g,"\\'")+'\')"><b>'+esc(s.name)+'</b><small class="d-block text-muted">'+s.rows+' baris · '+s.columns+' kolom</small></button></div>').join('')+'</div><div id="builderEditor" class="mt-4"></div>'}catch(e){box.innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}
async function openActivitySheet(name){state.builder.sheet=name;const ed=document.getElementById('builderEditor');ed.innerHTML='<div class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Membaca header...</div>';try{const x=await gas('getActivitySheetSchema',state.builder.kelasId,name);state.builder.columns=x.columns.map(c=>({column_id:c.column_id||'',label:c.label||'',type:'TEXT',required:false}));renderColumnEditor()}catch(e){ed.innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}
function renderColumnEditor(){const ed=document.getElementById('builderEditor');ed.innerHTML='<div class="card border"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-2"><div><h6 class="fw-bold mb-0">3. Header '+esc(state.builder.sheet)+'</h6><small class="text-muted">Buat kolom melalui frontend. Form kosong tersedia untuk sheet baru.</small></div><button class="btn btn-sm btn-success" onclick="addBuilderColumn()">+ Tambah Kolom</button></div><div class="builder-help mb-3"><small><b>Cara menulis:</b> <code>column_id</code> = ID teknis unik, huruf kecil, tanpa spasi (contoh <code>siswa_id</code>); <code>Label</code> = nama yang tampil (contoh <code>Nama Siswa</code>). ID tidak boleh sama. Set <b>Wajib</b> jika harus selalu diisi. Data lama tidak dihapus.</small></div><div id="columnList"></div><div class="d-flex gap-2 mt-3"><button class="btn btn-success" onclick="saveColumnSchema()">Simpan Header ke Sheet</button><button class="btn btn-outline-secondary" onclick="addBuilderColumn(3)">+ 3 Form Kosong</button></div></div></div>';renderBuilderRows()}
function addBuilderColumn(n=1){for(let i=0;i<n;i++)state.builder.columns.push({column_id:'',label:'',type:'TEXT',required:false});renderBuilderRows()}
function renderBuilderRows(){const box=document.getElementById('columnList');if(!box)return;if(!state.builder.columns.length){box.innerHTML='<div class="text-center text-muted py-4 border rounded-3">Belum ada kolom. Klik <b>+ Tambah Kolom</b> untuk membuat form.</div>';return}box.innerHTML=state.builder.columns.map((c,i)=>'<div class="column-card mb-2"><div class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label small mb-1">Column ID</label><input class="form-control form-control-sm" value="'+esc(c.column_id)+'" oninput="builderSet('+i+',\'column_id\',this.value)"><small class="text-muted">ID teknis: huruf kecil, tanpa spasi. Contoh: <code>siswa_id</code>, <code>tanggal</code>.</small></div><div class="col-md-4"><label class="form-label small mb-1">Label/Header</label><input class="form-control form-control-sm" value="'+esc(c.label)+'" oninput="builderSet('+i+',\'label\',this.value)"><small class="text-muted">Nama kolom yang dibaca manusia. Contoh: <code>Nama Siswa</code>.</small></div><div class="col-md-2"><label class="form-label small mb-1">Tipe</label><select class="form-select form-select-sm" onchange="builderSet('+i+',\'type\',this.value)"><option>TEXT</option><option '+(c.type==='DATE'?'selected':'')+'>DATE</option><option '+(c.type==='DATETIME'?'selected':'')+'>DATETIME</option><option '+(c.type==='NUMBER'?'selected':'')+'>NUMBER</option><option '+(c.type==='BOOLEAN'?'selected':'')+'>BOOLEAN</option></select></div><div class="col-md-1"><div class="form-check"><input class="form-check-input" type="checkbox" '+(c.required?'checked':'')+' onchange="builderSet('+i+',\'required\',this.checked)"><label class="form-check-label small">Wajib</label></div></div><div class="col-md-1 text-end"><button class="btn btn-sm btn-outline-danger" onclick="removeBuilderColumn('+i+')"><i class="bi bi-trash"></i></button></div></div></div>').join('')}
function builderSet(i,k,v){if(state.builder.columns[i])state.builder.columns[i][k]=v}function removeBuilderColumn(i){state.builder.columns.splice(i,1);renderBuilderRows()}async function saveColumnSchema(){if(!state.builder.sheet)return;const bad=state.builder.columns.find(c=>!String(c.column_id).trim()||!String(c.label).trim());if(bad)return alert('Semua kolom yang diisi harus memiliki Column ID dan Label.');try{const x=await gas('saveActivitySheetSchema',state.builder.kelasId,state.builder.sheet,state.builder.columns);state.builder.columns=x.columns.map(c=>({column_id:c.column_id,label:c.label,type:'TEXT',required:false}));renderColumnEditor();alert('Header '+state.builder.sheet+' berhasil disimpan.')}catch(e){alert('Gagal menyimpan header: '+errorText(e))}}

async function renderClassAdmin(){try{const cls=await gas('getMyClass'),rows=await gas('getMyStudents');state.studentRows=Array.isArray(rows)?rows:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><h5 class="mb-0">Kelola Kelas</h5></div><div class="card-body"><div class="mb-3"><b>'+esc(cls?.nama||'Kelas')+'</b><div class="text-muted small">Sheet: '+esc(cls?.sheet_name||'-')+'</div></div><button class="btn btn-success mb-3" onclick="editStudent(-1)">+ Tambah Siswa</button><div class="table-wrap"><table class="table"><thead><tr><th>NISN</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody>'+state.studentRows.map((r,i)=>'<tr><td>'+esc(r.nisn)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.status)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editStudent('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}function editStudent(i){const r=i<0?{status:'AKTIF'}:(state.studentRows[i]||{});document.getElementById('studentModalBody').innerHTML='<input type="hidden" data-sf="id" value="'+esc(r.id||'')+'"><div class="mb-2"><label class="form-label">NISN</label><input class="form-control" data-sf="nisn" value="'+esc(r.nisn||'')+'"></div><div class="mb-2"><label class="form-label">Nama</label><input class="form-control" data-sf="nama" value="'+esc(r.nama||'')+'"></div><div class="mb-2"><label class="form-label">Status</label><select class="form-select" data-sf="status"><option '+(String(r.status||'AKTIF')==='AKTIF'?'selected':'')+'>AKTIF</option><option '+(String(r.status||'')==='NONAKTIF'?'selected':'')+'>NONAKTIF</option></select></div>';new bootstrap.Modal(document.getElementById('studentModal')).show()}async function saveStudent(){const d={};document.querySelectorAll('#studentModal [data-sf]').forEach(x=>d[x.dataset.sf]=x.value);try{await gas('saveMyStudent',d);bootstrap.Modal.getInstance(document.getElementById('studentModal'))?.hide();await renderClassAdmin()}catch(e){alert('Gagal menyimpan siswa: '+errorText(e))}}
boot();</script></body></html>
