<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIM SATRIA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{--g:#0b3d2e;--g2:#1b5e20;--bg:#f4fff8}body{background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif}.app{min-height:100vh}.brand{background:linear-gradient(135deg,var(--g),#2e7d32);color:#fff}.sidebar{width:260px;background:#fff;border-right:1px solid #e5eee8}.content{min-width:0}.navbtn{border:0;background:transparent;width:100%;text-align:left;padding:11px 14px;border-radius:10px}.navbtn:hover,.navbtn.active{background:#eaf7ee;color:var(--g2)}.card{border:0;box-shadow:0 8px 25px rgba(11,61,46,.08)}.card-header{background:linear-gradient(135deg,var(--g),#66bb6a);color:#fff}.table-wrap{overflow:auto}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center}.login-card{width:min(420px,92vw)}.mobile-head{display:none}@media(max-width:900px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:1050;transition:.2s}.sidebar.open{left:0}.mobile-head{display:flex}.content{width:100%}}
  </style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="card login-card"><div class="card-body p-4">
  <h3 class="fw-bold mb-1">SIM SATRIA</h3><div class="text-muted mb-4">Class Builder</div>
  <div id="loginErr" class="alert alert-danger d-none"></div>
  <input id="username" class="form-control mb-2" placeholder="Username" autocomplete="username">
  <input id="password" type="password" class="form-control mb-3" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" class="btn btn-success w-100" onclick="doLogin()">Masuk</button>
</div></div></div>
<div id="appView" class="app d-flex d-none">
  <aside id="sidebar" class="sidebar p-3"><div class="brand rounded-4 p-3 mb-3"><div class="fw-bold">SIM SATRIA</div><small>Web App Builder</small></div><div id="userBox" class="small text-muted mb-3"></div><div id="menuList"></div><hr><button class="navbtn text-danger" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button></aside>
  <main class="content flex-grow-1"><div class="mobile-head p-2 bg-white border-bottom sticky-top"><button class="btn btn-light" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><span class="ms-2 fw-semibold">SIM SATRIA</span></div><div class="container-fluid p-3 p-lg-4"><div id="page"></div></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const state={session:null,menus:[],entity:null,rows:[],menuRows:[],studentRows:[]};
const masterMeta={USERS:['Pengguna',['username','nama','role','kelas_id','status']],GURU:['Guru',['nip','nama','status']],KARYAWAN:['Karyawan',['nik','nama','status']],SISWA:['Siswa',['nisn','nama','kelas_id','status']],KELAS:['Kelas',['kode','nama','sheet_name','admin_user_id','status']],MAPEL:['Mapel',['kode','nama','status']]};
function gas(fn,...args){return new Promise((resolve,reject)=>{if(!window.google||!google.script||!google.script.run)return reject(new Error('google.script.run tidak tersedia. Buka Web App dari URL deployment.'));google.script.run.withSuccessHandler(r=>resolve(r)).withFailureHandler(e=>reject(e||new Error('Server tidak mengembalikan respons.')))[fn](...args)})}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function show(id,on){const e=document.getElementById(id);if(e)e.classList.toggle('d-none',!on)}
function errText(e){const s=String(e?.message||e||'Terjadi kesalahan');return s.replace(/^Exception:\s*/,'').replace(/^Error:\s*/,'')}
function setError(msg){const e=document.getElementById('loginErr');e.textContent=msg;e.classList.toggle('d-none',!msg)}
async function doLogin(){const b=document.getElementById('loginBtn');b.disabled=true;setError('');try{const r=await gas('login',document.getElementById('username').value,document.getElementById('password').value);if(!r||typeof r!=='object')throw new Error('Respons login kosong.');if(!r.ok){setError(r.message||'Username atau password salah.');return}if(!r.user||!r.token)throw new Error('Respons login tidak lengkap.');state.session=r.user;state.menus=Array.isArray(r.menus)?r.menus:[];await gas('setActiveToken',r.token);enterApp()}catch(e){setError(errText(e))}finally{b.disabled=false}}
async function boot(){try{const s=await gas('getAppState');if(s?.authenticated&&s.session){state.session=s.session;state.menus=Array.isArray(s.menus)?s.menus:[];enterApp()}}catch(e){console.log(e)}}
function enterApp(){show('loginView',false);show('appView',true);document.getElementById('userBox').innerHTML='<b>'+esc(state.session.nama)+'</b><br>'+esc(state.session.role)+(state.session.kelas_id?'<br>Kelas: '+esc(state.session.kelas_id):'');renderMenus();renderHome()}
function renderMenus(){const role=state.session.role;let html=state.menus.map((m,i)=>'<button class="navbtn" onclick="openMenu('+i+')"><i class="bi '+esc(m.icon||'bi-grid')+' me-2"></i>'+esc(m.label)+'</button>').join('');if(role==='OWNER')html+='<hr><button class="navbtn" onclick="renderMaster()"><i class="bi bi-database me-2"></i>MASTER</button><button class="navbtn" onclick="renderMenuBuilder()"><i class="bi bi-list-task me-2"></i>Menu Builder</button>';if(role==='ADMIN_KELAS')html+='<hr><button class="navbtn" onclick="renderClassAdmin()"><i class="bi bi-people me-2"></i>Kelola Kelas</button>';document.getElementById('menuList').innerHTML=html}
function renderHome(){document.getElementById('page').innerHTML='<div class="card"><div class="card-body"><h4 class="fw-bold">Selamat datang</h4><div class="text-muted">'+esc(state.session.nama)+' · '+esc(state.session.role)+'</div></div></div>'}
function openMenu(i){const m=state.menus[i];if(!m)return;if(m.key==='7kaih')return render7KAIH();const fn=m.handler;if(typeof window[fn]==='function')window[fn](m);else document.getElementById('page').innerHTML='<div class="alert alert-warning">Handler <code>'+esc(fn)+'</code> belum tersedia.</div>'}
function render7KAIH(){const a=['Bangun Pagi','Beribadah','Berolahraga','Makan Sehat','Gemar Belajar','Bermasyarakat','Tidur Cepat'];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><h5 class="mb-0">7KAIH</h5></div><div class="card-body"><div class="row g-3">'+a.map((x,i)=>'<div class="col-sm-6 col-lg-4"><div class="p-3 border rounded-4"><b>'+(i+1)+'. '+x+'</b><small class="d-block text-muted">Modul 7 Kebiasaan Anak Indonesia Hebat</small></div></div>').join('')+'</div></div></div>'}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
async function doLogout(){try{await gas('logout')}catch(e){}location.reload()}
async function renderMaster(){document.getElementById('page').innerHTML='<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><b>MASTER</b><select id="masterEntity" class="form-select form-select-sm w-auto" onchange="loadMaster()">'+Object.entries(masterMeta).map(([k,v])=>'<option value="'+k+'">'+v[0]+'</option>').join('')+'</select></div><div class="card-body"><div class="d-flex gap-2 mb-3"><button class="btn btn-success" onclick="newMasterRow()"><i class="bi bi-plus"></i> Tambah</button><button class="btn btn-outline-secondary" onclick="loadMaster()">Refresh</button></div><div id="masterMsg"></div><div class="table-wrap"><table class="table table-hover"><thead id="masterHead"></thead><tbody id="masterBody"></tbody></table></div></div></div>';await loadMaster()}
async function loadMaster(){const sel=document.getElementById('masterEntity');if(!sel)return;state.entity=sel.value;try{const result=await gas('getMasterRows',state.entity);state.rows=Array.isArray(result)?result:[];const cols=(masterMeta[state.entity]?.[1]||[]);document.getElementById('masterHead').innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th></th></tr>';document.getElementById('masterBody').innerHTML=state.rows.length?state.rows.map((r,i)=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'<td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" onclick="editMaster('+i+')">Edit</button><button class="btn btn-sm btn-outline-danger" onclick="delMaster('+i+')">Hapus</button></td></tr>').join(''):'<tr><td colspan="99" class="text-center text-muted py-4">Belum ada data</td></tr>'}catch(e){document.getElementById('masterBody').innerHTML='<tr><td colspan="99" class="text-danger">'+esc(errText(e))+'</td></tr>'}}
function fieldHtml(c,v,isUser){let input='<input class="form-control" data-f="'+c+'" value="'+esc(v)+'">';if(c==='role')input='<select class="form-select" data-f="role"><option value="OWNER">OWNER</option><option value="ADMIN_KELAS">ADMIN_KELAS</option><option value="GURU">GURU</option><option value="KARYAWAN">KARYAWAN</option><option value="SISWA">SISWA</option></select>';if(c==='status')input='<select class="form-select" data-f="status"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select>';return '<div class="mb-2"><label class="form-label small">'+esc(c)+'</label>'+input+'</div>'}
function editMaster(i){const r=i<0?{}:state.rows[i],cols=masterMeta[state.entity]?.[1]||[];if(!masterMeta[state.entity])return;let body=cols.map(c=>fieldHtml(c,r[c]??'',state.entity==='USERS')).join('');if(state.entity==='USERS')body+='<div class="mb-2"><label class="form-label small">password '+(i<0?'(wajib)':'(kosongkan jika tidak diubah)')+'</label><input type="password" class="form-control" data-f="password" autocomplete="new-password"></div>';body+='<input type="hidden" data-f="id" value="'+esc(r.id||'')+'">';document.getElementById('page').insertAdjacentHTML('beforeend','<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">'+(i<0?'Tambah ':'Edit ')+esc(masterMeta[state.entity][0])+'</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">'+body+'</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMaster()">Simpan</button></div></div></div></div>');const modal=document.getElementById('dataModal');if(state.entity==='USERS'){const role=modal.querySelector('[data-f="role"]');if(role)role.value=r.role||'GURU'}if(state.entity==='KELAS'){const sn=modal.querySelector('[data-f="sheet_name"]');if(sn){sn.readOnly=true;sn.placeholder='Otomatis dibuat server';}}new bootstrap.Modal(modal).show()}
async function saveMaster(){const modal=document.getElementById('dataModal');if(!modal)return;const d={};modal.querySelectorAll('[data-f]').forEach(x=>{if(x.dataset.f==='password'&&!x.value)return;d[x.dataset.f]=x.value});const btn=modal.querySelector('.btn-success');btn.disabled=true;try{const r=await gas('saveMasterRow',state.entity,d);if(!r?.ok)throw new Error(r?.message||'Gagal menyimpan');bootstrap.Modal.getInstance(modal)?.hide();modal.remove();await loadMaster()}catch(e){alert('Gagal menyimpan: '+errText(e))}finally{btn.disabled=false}}
async function delMaster(i){const r=state.rows[i];if(!r||!confirm('Hapus data ini?'))return;try{const x=await gas('deleteMasterRow',state.entity,r.id);if(!x?.ok)throw new Error('Gagal menghapus');await loadMaster()}catch(e){alert('Gagal menghapus: '+errText(e))}}
async function renderMenuBuilder(){try{const rows=await gas('getMenuBuilder');state.menuRows=Array.isArray(rows)?rows:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header d-flex justify-content-between"><b>Menu Builder</b><button class="btn btn-light btn-sm" onclick="editMenu(-1)">+ Menu</button></div><div class="card-body table-wrap"><table class="table"><thead><tr><th>Key</th><th>Label</th><th>Handler</th><th>Roles</th><th>Aktif</th><th></th></tr></thead><tbody>'+state.menuRows.map((r,i)=>'<tr><td>'+esc(r.key)+'</td><td>'+esc(r.label)+'</td><td>'+esc(r.handler)+'</td><td>'+esc(r.roles)+'</td><td>'+esc(r.active)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editMenu('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errText(e))+'</div>'}}
function editMenu(i){const r=i<0?{}:state.menuRows[i]||{};const fields=['id','key','label','icon','handler','urutan','roles','active','config_json'];const body=fields.map(f=>'<div class="mb-2"><label class="form-label small">'+f+'</label><input class="form-control" data-mf="'+f+'" value="'+esc(r[f]??'')+'"></div>').join('');document.getElementById('page').insertAdjacentHTML('beforeend','<div class="modal fade" id="menuModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Menu Builder</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">'+body+'</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMenu()">Simpan</button></div></div></div></div>');new bootstrap.Modal(document.getElementById('menuModal')).show()}
async function saveMenu(){const d={};document.querySelectorAll('#menuModal [data-mf]').forEach(x=>d[x.dataset.mf]=x.value);d.active=String(d.active).toLowerCase()!=='false';try{await gas('saveMenu',d);bootstrap.Modal.getInstance(document.getElementById('menuModal'))?.hide();document.getElementById('menuModal')?.remove();await renderMenuBuilder()}catch(e){alert(errText(e))}}
async function renderClassAdmin(){try{const cls=await gas('getMyClass'),rows=await gas('getMyStudents');state.studentRows=Array.isArray(rows)?rows:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><b>Kelola Kelas</b></div><div class="card-body"><b>'+esc(cls?.nama||'Kelas')+'</b><div class="small text-muted mb-3">Sheet: '+esc(cls?.sheet_name||'-')+'</div><button class="btn btn-success mb-3" onclick="editStudent(-1)">Tambah Siswa</button><div class="table-wrap"><table class="table"><thead><tr><th>NISN</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody>'+state.studentRows.map((r,i)=>'<tr><td>'+esc(r.nisn)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.status)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editStudent('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errText(e))+'</div>'}}
function editStudent(i){const r=i<0?{kelas_id:state.session.kelas_id,status:'AKTIF'}:(state.studentRows[i]||{});const body=['id','nisn','nama','kelas_id','status'].map(f=>'<div class="mb-2"><label class="form-label small">'+f+'</label><input class="form-control" data-sf="'+f+'" value="'+esc(r[f]??'')+'"></div>').join('');document.getElementById('page').insertAdjacentHTML('beforeend','<div class="modal fade" id="studentModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Siswa</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">'+body+'</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveStudent()">Simpan</button></div></div></div></div>');const m=document.getElementById('studentModal');m.querySelector('[data-sf="kelas_id"]').readOnly=true;new bootstrap.Modal(m).show()}
async function saveStudent(){const d={};document.querySelectorAll('#studentModal [data-sf]').forEach(x=>d[x.dataset.sf]=x.value);try{await gas('saveMyStudent',d);bootstrap.Modal.getInstance(document.getElementById('studentModal'))?.hide();document.getElementById('studentModal')?.remove();await renderClassAdmin()}catch(e){alert(errText(e))}}
boot();
</script>
</body>
</html>
