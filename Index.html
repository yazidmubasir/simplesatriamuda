<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIM SATRIA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{--g:#0b3d2e;--g2:#1b5e20;--bg:#f4fff8}body{background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif}.app{min-height:100vh}.brand{background:linear-gradient(135deg,var(--g),#2e7d32);color:#fff}.sidebar{width:260px;background:#fff;border-right:1px solid #e5eee8}.content{min-width:0}.navbtn{border:0;background:transparent;width:100%;text-align:left;padding:11px 14px;border-radius:10px}.navbtn.active,.navbtn:hover{background:#eaf7ee;color:var(--g2)}.card{border:0;box-shadow:0 8px 25px rgba(11,61,46,.08)}.card-header{background:linear-gradient(135deg,var(--g),#66bb6a);color:#fff}.table-wrap{overflow:auto}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center}.login-card{width:min(420px,92vw)}.stat{padding:18px;border-radius:16px;background:#f5faf6}.mobile-head{display:none}
    @media(max-width:900px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:30;transition:.2s}.sidebar.open{left:0}.mobile-head{display:flex}.content{width:100%}}
  </style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="card login-card"><div class="card-body p-4">
    <h3 class="fw-bold mb-1">SIM SATRIA</h3><div class="text-muted mb-4">Class Builder</div>
    <div id="loginErr" class="alert alert-danger hidden"></div>
    <input id="username" class="form-control mb-2" placeholder="Username" autocomplete="username">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="btn btn-success w-100" onclick="doLogin()">Masuk</button>
  </div></div>
</div>
<div id="appView" class="app d-flex hidden">
  <aside id="sidebar" class="sidebar p-3">
    <div class="brand rounded-4 p-3 mb-3"><div class="fw-bold">SIM SATRIA</div><small>Web App Builder</small></div>
    <div id="userBox" class="small text-muted mb-3"></div>
    <div id="menuList"></div>
    <hr><button class="navbtn text-danger" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button>
  </aside>
  <main class="content flex-grow-1">
    <div class="mobile-head p-2 bg-white border-bottom sticky-top"><button class="btn btn-light" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><span class="ms-2 fw-semibold">SIM SATRIA</span></div>
    <div class="container-fluid p-3 p-lg-4"><div id="page"></div></div>
  </main>
</div>
<script>
const state={session:null,menus:[],entity:null,rows:[]};
function gas(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args));}
function show(id,on=true){document.getElementById(id).classList.toggle('hidden',!on)}
function escapeHtml(x){return String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
async function doLogin(){const b=document.getElementById('loginBtn');b.disabled=true;document.getElementById('loginErr').classList.add('hidden');try{const r=await gas('login',username.value,password.value);if(!r.ok){loginErr.textContent=r.message;loginErr.classList.remove('hidden');return}state.session=r.user;state.menus=r.menus;await gas('setActiveToken',r.token);enterApp()}catch(e){loginErr.textContent=e.message||e;loginErr.classList.remove('hidden')}finally{b.disabled=false}}
async function boot(){try{const s=await gas('getAppState');if(s.authenticated){state.session=s.session;state.menus=s.menus;enterApp()}}catch(e){console.error(e)}}
function enterApp(){show('loginView',false);show('appView',true);userBox.innerHTML=`<b>${escapeHtml(state.session.nama)}</b><br>${escapeHtml(state.session.role)}${state.session.kelas_id?'<br>Kelas: '+escapeHtml(state.session.kelas_id):''}`;renderMenus();renderHome()}
function renderMenus(){menuList.innerHTML=state.menus.map((m,i)=>`<button class="navbtn" onclick="openMenu(${i})"><i class="bi ${escapeHtml(m.icon||'bi-grid')} me-2"></i>${escapeHtml(m.label)}</button>`).join('')+(state.session.role==='OWNER'?`<hr><button class="navbtn" onclick="renderMaster()"><i class="bi bi-database me-2"></i>MASTER</button><button class="navbtn" onclick="renderMenuBuilder()"><i class="bi bi-list-task me-2"></i>Menu Builder</button>`:state.session.role==='ADMIN_KELAS'?`<hr><button class="navbtn" onclick="renderClassAdmin()"><i class="bi bi-people me-2"></i>Kelola Kelas</button>`:'')}
function renderHome(){page.innerHTML=`<div class="row g-3"><div class="col-12"><div class="card"><div class="card-body"><h4 class="fw-bold mb-1">Selamat datang</h4><div class="text-muted">${escapeHtml(state.session.nama)} · ${escapeHtml(state.session.role)}</div></div></div></div><div class="col-md-4"><div class="stat"><b>Menu aktif</b><div class="fs-3">${state.menus.length}</div></div></div></div>`}
async function openMenu(i){const m=state.menus[i];document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));if(m.key==='7kaih')return render7KAIH();const fn=m.handler; if(typeof window[fn]==='function')window[fn](m);else page.innerHTML=`<div class="card"><div class="card-body"><h4>${escapeHtml(m.label)}</h4><p class="text-muted">Handler <code>${escapeHtml(fn)}</code> belum diimplementasikan.</p></div></div>`}
function toggleSidebar(){sidebar.classList.toggle('open')}
async function doLogout(){await gas('logout');location.reload()}
function render7KAIH(){page.innerHTML=`<div class="card"><div class="card-header"><h5 class="mb-0">7KAIH</h5></div><div class="card-body"><div class="row g-3">${['Bangun Pagi','Beribadah','Berolahraga','Makan Sehat','Gemar Belajar','Bermasyarakat','Tidur Cepat'].map((x,i)=>`<div class="col-sm-6 col-lg-4"><div class="p-3 border rounded-4"><div class="fw-semibold">${i+1}. ${x}</div><small class="text-muted">Modul 7 Kebiasaan Anak Indonesia Hebat</small></div></div>`).join('')}</div></div></div>`}
const masterMeta={USERS:['Pengguna','username,nama,role,kelas_id,status'],GURU:['Guru','nip,nama,status'],KARYAWAN:['Karyawan','nik,nama,status'],SISWA:['Siswa','nisn,nama,kelas_id,status'],KELAS:['Kelas','kode,nama,sheet_name,admin_user_id,status'],MAPEL:['Mapel','kode,nama,status']};
async function renderMaster(){page.innerHTML=`<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><span>MASTER</span><select id="masterEntity" class="form-select form-select-sm w-auto" onchange="loadMaster()">${Object.entries(masterMeta).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div><div class="card-body"><div id="masterToolbar" class="d-flex gap-2 mb-3"><button class="btn btn-success" onclick="newMasterRow()"><i class="bi bi-plus"></i> Tambah</button><button class="btn btn-outline-secondary" onclick="loadMaster()">Refresh</button></div><div class="table-wrap"><table class="table table-hover align-middle"><thead id="masterHead"></thead><tbody id="masterBody"></tbody></table></div></div></div>`;await loadMaster()}
async function loadMaster(){state.entity=masterEntity.value;state.rows=await gas('getMasterRows',state.entity);const cols=masterMeta[state.entity][1].split(',');masterHead.innerHTML='<tr>'+cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')+'<th></th></tr>';masterBody.innerHTML=state.rows.map((r,i)=>'<tr>'+cols.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')+`<td class="text-end"><button class="btn btn-sm btn-outline-primary me-1" onclick="editMaster(${i})"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="delMaster(${i})"><i class="bi bi-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="99" class="text-center text-muted">Belum ada data</td></tr>'}
function newMasterRow(){editMaster(-1)}
function editMaster(i){const r=i<0?{}:state.rows[i], cols=masterMeta[state.entity][1].split(',');const vals=cols.map(c=>`<div class="mb-2"><label class="form-label small">${escapeHtml(c)}</label><input class="form-control" data-f="${c}" value="${escapeHtml(r[c]??'')}"></div>`).join('');page.innerHTML+=`<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">${i<0?'Tambah':'Edit'} ${masterMeta[state.entity][0]}</h5></div><div class="modal-body"><input type="hidden" data-f="id" value="${escapeHtml(r.id||'')}">${vals}</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMaster()">Simpan</button></div></div></div></div>`;new bootstrap.Modal(dataModal).show()}
async function saveMaster(){const d={};document.querySelectorAll('#dataModal [data-f]').forEach(x=>d[x.dataset.f]=x.value);if(state.entity==='USERS'&&d.password)d.password_hash=d.password;delete d.password;try{await gas('saveMasterRow',state.entity,d);bootstrap.Modal.getInstance(dataModal).hide();await loadMaster()}catch(e){alert(e.message||e)}}
async function delMaster(i){if(!confirm('Hapus data ini?'))return;try{await gas('deleteMasterRow',state.entity,state.rows[i].id);await loadMaster()}catch(e){alert(e.message||e)}}
async function renderMenuBuilder(){const rows=await gas('getMenuBuilder');page.innerHTML=`<div class="card"><div class="card-header d-flex justify-content-between"><span>Menu Builder</span><button class="btn btn-light btn-sm" onclick="editMenu(-1)"><i class="bi bi-plus"></i> Menu</button></div><div class="card-body table-wrap"><table class="table"><thead><tr><th>Key</th><th>Label</th><th>Handler</th><th>Roles</th><th>Aktif</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${escapeHtml(r.key)}</td><td>${escapeHtml(r.label)}</td><td>${escapeHtml(r.handler)}</td><td>${escapeHtml(r.roles)}</td><td>${r.active}</td><td><button class="btn btn-sm btn-outline-primary" onclick='editMenu(${JSON.stringify(i)})'>Edit</button></td></tr>`).join('')}</tbody></table></div></div>`;window.menuRows=rows}
function editMenu(i){const r=i<0?{}:menuRows[i];page.innerHTML+=`<div class="modal fade" id="menuModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Menu Builder</h5></div><div class="modal-body">${['id','key','label','icon','handler','urutan','roles','active','config_json'].map(f=>`<div class="mb-2"><label class="form-label small">${f}</label><input class="form-control" data-mf="${f}" value="${escapeHtml(r[f]??'')}"></div>`).join('')}</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMenu()">Simpan</button></div></div></div></div>`;new bootstrap.Modal(menuModal).show()}
async function saveMenu(){const d={};document.querySelectorAll('#menuModal [data-mf]').forEach(x=>d[x.dataset.mf]=x.value);d.active=String(d.active).toLowerCase()!=='false';await gas('saveMenu',d);bootstrap.Modal.getInstance(menuModal).hide();renderMenuBuilder()}
async function renderClassAdmin(){const cls=await gas('getMyClass'),rows=await gas('getMyStudents');page.innerHTML=`<div class="card"><div class="card-header"><h5 class="mb-0">Kelola Kelas</h5></div><div class="card-body"><div class="mb-3"><b>${escapeHtml(cls?.nama||'Kelas')}</b><div class="text-muted small">Sheet: ${escapeHtml(cls?.sheet_name||'-')}</div></div><button class="btn btn-success mb-3" onclick="editStudent(-1)">Tambah Siswa</button><div class="table-wrap"><table class="table"><thead><tr><th>NISN</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${escapeHtml(r.nisn)}</td><td>${escapeHtml(r.nama)}</td><td>${escapeHtml(r.status)}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editStudent(${i})">Edit</button></td></tr>`).join('')}</tbody></table></div></div></div>`;window.studentRows=rows}
function editStudent(i){const r=i<0?{kelas_id:state.session.kelas_id,status:'AKTIF'}:studentRows[i];page.innerHTML+=`<div class="modal fade" id="studentModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">${['id','nisn','nama','kelas_id','status'].map(f=>`<input class="form-control mb-2" data-sf="${f}" placeholder="${f}" value="${escapeHtml(r[f]??'')}">`).join('')}<button class="btn btn-success w-100" onclick="saveStudent()">Simpan</button></div></div></div></div>`;new bootstrap.Modal(studentModal).show()}
async function saveStudent(){const d={};document.querySelectorAll('#studentModal [data-sf]').forEach(x=>d[x.dataset.sf]=x.value);await gas('saveMyStudent',d);bootstrap.Modal.getInstance(studentModal).hide();renderClassAdmin()}
boot();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
