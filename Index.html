<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIM SATRIA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--g:#0b3d2e;--g2:#1b5e20;--bg:#f4fff8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif}.app{min-height:100vh}.sidebar{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid #e5eee8}.brand{background:linear-gradient(135deg,var(--g),#2e7d32);color:#fff}.content{min-width:0}.navbtn{border:0;background:transparent;width:100%;text-align:left;padding:11px 14px;border-radius:10px}.navbtn:hover,.navbtn.active{background:#eaf7ee;color:var(--g2)}.card{border:0;box-shadow:0 8px 25px rgba(11,61,46,.08)}.card-header{background:linear-gradient(135deg,var(--g),#66bb6a);color:#fff}.table-wrap{overflow:auto}.login-wrap{min-height:100vh;display:grid;place-items:center}.login-card{width:min(420px,92vw)}.mobile-head{display:none}.master-select{min-width:150px}.table th{white-space:nowrap}.table td{vertical-align:middle}.loading-row{padding:35px!important}@media(max-width:900px){.sidebar{position:fixed;left:-270px;top:0;bottom:0;z-index:1050;transition:left .2s;box-shadow:5px 0 25px rgba(0,0,0,.12)}.sidebar.open{left:0}.mobile-head{display:flex}.content{width:100%}.master-head{gap:8px;flex-wrap:wrap}.master-select{width:100%;min-width:0}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="card login-card"><div class="card-body p-4"><h3 class="fw-bold mb-1">SIM SATRIA</h3><div class="text-muted mb-4">Class Builder</div><div id="loginErr" class="alert alert-danger d-none"></div><input id="username" class="form-control mb-2" placeholder="Username" autocomplete="username"><input id="password" type="password" class="form-control mb-3" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="btn btn-success w-100" onclick="doLogin()">Masuk</button></div></div></div>
<div id="appView" class="app d-flex d-none"><aside id="sidebar" class="sidebar p-3"><div class="brand rounded-4 p-3 mb-3"><div class="fw-bold">SIM SATRIA</div><small>Web App Builder</small></div><div id="userBox" class="small text-muted mb-3"></div><div id="menuList"></div><hr><button class="navbtn text-danger" onclick="doLogout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button></aside><main class="content flex-grow-1"><div class="mobile-head p-2 bg-white border-bottom sticky-top"><button class="btn btn-light" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><span class="ms-2 fw-semibold">SIM SATRIA</span></div><div class="container-fluid p-3 p-lg-4"><div id="page"></div></div></main></div>
<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 id="dataModalTitle" class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="dataModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button id="dataSaveBtn" class="btn btn-success" onclick="saveMaster()">Simpan</button></div></div></div></div>
<div class="modal fade" id="menuModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Menu Builder</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="menuModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveMenu()">Simpan</button></div></div></div></div>
<div class="modal fade" id="studentModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Data Siswa</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div id="studentModalBody" class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-success" onclick="saveStudent()">Simpan</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const state={session:null,menus:[],entity:'USERS',rows:[],menuRows:[],studentRows:[],editingIndex:-1};
const masterMeta={USERS:{label:'Pengguna',cols:['username','nama','role','kelas_id','status']},GURU:{label:'Guru',cols:['nip','nama','status']},KARYAWAN:{label:'Karyawan',cols:['nik','nama','status']},SISWA:{label:'Siswa',cols:['nisn','nama','kelas_id','status']},KELAS:{label:'Kelas',cols:['kode','nama','sheet_name','admin_user_id','status']},MAPEL:{label:'Mapel',cols:['kode','nama','status']}};
const roleOptions=['OWNER','ADMIN_KELAS','GURU','KARYAWAN','SISWA'];
function gas(fn,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error('google.script.run tidak tersedia. Pastikan URL Web App deployment digunakan.'));google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e||new Error('Server tidak mengembalikan respons.')))[fn](...args)})}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function errorText(e){return String(e?.message||e||'Terjadi kesalahan').replace(/^Exception:\s*/,'').replace(/^Error:\s*/,'')}
function show(id,on){document.getElementById(id)?.classList.toggle('d-none',!on)}
function setLoginError(s){const e=document.getElementById('loginErr');e.textContent=s||'';e.classList.toggle('d-none',!s)}
async function doLogin(){const b=document.getElementById('loginBtn');b.disabled=true;setLoginError('');try{const r=await gas('login',document.getElementById('username').value.trim(),document.getElementById('password').value);if(!r?.ok)throw new Error(r?.message||'Username atau password salah.');if(!r.user||!r.token)throw new Error('Respons login tidak lengkap.');state.session=r.user;state.menus=Array.isArray(r.menus)?r.menus:[];await gas('setActiveToken',r.token);enterApp()}catch(e){setLoginError(errorText(e))}finally{b.disabled=false}}
async function boot(){try{const r=await gas('getAppState');if(r?.authenticated&&r.session){state.session=r.session;state.menus=Array.isArray(r.menus)?r.menus:[];enterApp()}}catch(e){console.debug(e)}}
function enterApp(){show('loginView',false);show('appView',true);document.getElementById('userBox').innerHTML='<b>'+esc(state.session.nama)+'</b><br>'+esc(state.session.role)+(state.session.kelas_id?'<br>Kelas: '+esc(state.session.kelas_id):'');renderMenus();renderHome()}
function renderMenus(){const role=state.session.role;let h=(Array.isArray(state.menus)?state.menus:[]).map((m,i)=>'<button class="navbtn" onclick="openMenu('+i+')"><i class="bi '+esc(m.icon||'bi-grid')+' me-2"></i>'+esc(m.label||m.key)+'</button>').join('');if(role==='OWNER')h+='<hr><button class="navbtn" onclick="renderMaster()"><i class="bi bi-database me-2"></i>MASTER</button><button class="navbtn" onclick="renderMenuBuilder()"><i class="bi bi-list-task me-2"></i>Menu Builder</button>';if(role==='ADMIN_KELAS')h+='<hr><button class="navbtn" onclick="renderClassAdmin()"><i class="bi bi-people me-2"></i>Kelola Kelas</button>';document.getElementById('menuList').innerHTML=h}
function renderHome(){document.getElementById('page').innerHTML='<div class="card"><div class="card-body"><h4 class="fw-bold mb-1">Selamat datang</h4><div class="text-muted">'+esc(state.session.nama)+' · '+esc(state.session.role)+'</div></div></div>'}
function openMenu(i){const m=state.menus[i];if(!m)return;if(m.key==='7kaih')return render7KAIH();const fn=String(m.handler||'');if(typeof window[fn]==='function')return window[fn](m);document.getElementById('page').innerHTML='<div class="alert alert-warning">Handler <code>'+esc(fn)+'</code> belum tersedia.</div>'}
function render7KAIH(){const a=['Bangun Pagi','Beribadah','Berolahraga','Makan Sehat','Gemar Belajar','Bermasyarakat','Tidur Cepat'];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><h5 class="mb-0">7KAIH</h5></div><div class="card-body"><div class="row g-3">'+a.map((x,i)=>'<div class="col-sm-6 col-lg-4"><div class="p-3 border rounded-4"><b>'+(i+1)+'. '+x+'</b><small class="d-block text-muted">Modul 7 Kebiasaan Anak Indonesia Hebat</small></div></div>').join('')+'</div></div></div>'}
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open')}
async function doLogout(){try{await gas('logout')}catch(e){}location.reload()}
function renderMasterShell(){document.getElementById('page').innerHTML='<div class="card"><div class="card-header master-head d-flex justify-content-between align-items-center"><div><h5 class="mb-0">MASTER</h5><small>Pengaturan data utama sistem</small></div><select id="masterEntity" class="form-select form-select-sm master-select" onchange="loadMaster()">'+Object.entries(masterMeta).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('')+'</select></div><div class="card-body"><div class="d-flex flex-wrap gap-2 mb-3"><button id="addMasterBtn" class="btn btn-success" onclick="newMasterRow()"><i class="bi bi-plus-lg me-1"></i>Tambah</button><button id="refreshMasterBtn" class="btn btn-outline-secondary" onclick="loadMaster()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button></div><div id="masterMsg"></div><div class="table-wrap"><table class="table table-hover align-middle mb-0"><thead id="masterHead"></thead><tbody id="masterBody"></tbody></table></div></div></div>'}
async function renderMaster(){renderMasterShell();await loadMaster()}
function setMasterBusy(b){['addMasterBtn','refreshMasterBtn'].forEach(id=>{const x=document.getElementById(id);if(x)x.disabled=b})}
async function loadMaster(){const sel=document.getElementById('masterEntity');if(!sel)return;state.entity=sel.value;const meta=masterMeta[state.entity];const head=document.getElementById('masterHead'),body=document.getElementById('masterBody');if(!meta||!head||!body)return;head.innerHTML='<tr>'+meta.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th class="text-end">Aksi</th></tr>';body.innerHTML='<tr><td colspan="99" class="text-center text-muted loading-row"><div class="spinner-border spinner-border-sm me-2"></div>Memuat '+esc(meta.label)+'...</td></tr>';setMasterBusy(true);try{const result=await gas('getMasterRows',state.entity);state.rows=Array.isArray(result)?result:[];if(!state.rows.length){body.innerHTML='<tr><td colspan="99" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Belum ada data '+esc(meta.label)+'.</td></tr>';return}body.innerHTML=state.rows.map((r,i)=>'<tr>'+meta.cols.map(c=>'<td>'+esc(r?.[c])+'</td>').join('')+'<td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary me-1" onclick="editMaster('+i+')"><i class="bi bi-pencil"></i> Edit</button><button class="btn btn-sm btn-outline-danger" onclick="delMaster('+i+')"><i class="bi bi-trash"></i> Hapus</button></td></tr>').join('')}catch(e){state.rows=[];body.innerHTML='<tr><td colspan="99"><div class="alert alert-danger mb-0"><b>Gagal memuat '+esc(meta.label)+'.</b><br>'+esc(errorText(e))+'<div class="mt-2"><button class="btn btn-sm btn-outline-danger" onclick="loadMaster()">Coba lagi</button></div></div></td></tr>'}finally{setMasterBusy(false)}}
function inputFor(c,v){const val=esc(v);if(c==='role')return '<select class="form-select" data-f="role">'+roleOptions.map(x=>'<option value="'+x+'" '+(String(v||'')===x?'selected':'')+'>'+x+'</option>').join('')+'</select>';if(c==='status')return '<select class="form-select" data-f="status"><option value="AKTIF" '+(String(v||'AKTIF').toUpperCase()==='AKTIF'?'selected':'')+'>AKTIF</option><option value="NONAKTIF" '+(String(v||'').toUpperCase()==='NONAKTIF'?'selected':'')+'>NONAKTIF</option></select>';const ro=c==='sheet_name'?'readonly':'';const ph=c==='sheet_name'?'Otomatis dibuat server':'';return '<input class="form-control" data-f="'+c+'" value="'+val+'" '+ro+' placeholder="'+ph+'">'}
function newMasterRow(){openMasterModal(-1)}
function editMaster(i){openMasterModal(i)}
function openMasterModal(i){if(!masterMeta[state.entity])return;state.editingIndex=i;const r=i<0?{}:(state.rows[i]||{}),meta=masterMeta[state.entity];let html='<input type="hidden" data-f="id" value="'+esc(r.id||'')+'">';html+='<div class="row g-2">';meta.cols.forEach(c=>{html+='<div class="col-md-6"><label class="form-label small fw-semibold">'+esc(c)+'</label>'+inputFor(c,r[c])+'</div>'});if(state.entity==='USERS')html+='<div class="col-md-6"><label class="form-label small fw-semibold">Password '+(i<0?'<span class="text-danger">*</span>':'<span class="text-muted">(kosongkan jika tidak diubah)</span>')+'</label><input type="password" class="form-control" data-f="password" autocomplete="new-password"></div>';html+='</div>';document.getElementById('dataModalTitle').textContent=(i<0?'Tambah ':'Edit ')+meta.label;document.getElementById('dataModalBody').innerHTML=html;new bootstrap.Modal(document.getElementById('dataModal')).show()}
async function saveMaster(){const modal=document.getElementById('dataModal'),btn=document.getElementById('dataSaveBtn');const d={};modal.querySelectorAll('[data-f]').forEach(x=>{if(x.dataset.f==='password'&&!x.value)return;d[x.dataset.f]=x.value});btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';try{const r=await gas('saveMasterRow',state.entity,d);if(!r?.ok)throw new Error(r?.message||'Gagal menyimpan data.');bootstrap.Modal.getInstance(modal)?.hide();await loadMaster()}catch(e){alert('Gagal menyimpan '+masterMeta[state.entity].label+':\n'+errorText(e))}finally{btn.disabled=false;btn.textContent='Simpan'}}
async function delMaster(i){const r=state.rows[i];if(!r?.id)return;if(!confirm('Hapus data '+(r.nama||r.username||r.nip||r.nik||r.nisn||r.kode||'ini')+'?'))return;try{const x=await gas('deleteMasterRow',state.entity,r.id);if(!x?.ok)throw new Error('Gagal menghapus.');await loadMaster()}catch(e){alert('Gagal menghapus: '+errorText(e))}}
async function renderMenuBuilder(){try{const x=await gas('getMenuBuilder');state.menuRows=Array.isArray(x)?x:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header d-flex justify-content-between align-items-center"><div><h5 class="mb-0">Menu Builder</h5><small>Hanya OWNER</small></div><button class="btn btn-light btn-sm" onclick="editMenu(-1)"><i class="bi bi-plus-lg"></i> Menu</button></div><div class="card-body table-wrap"><table class="table align-middle"><thead><tr><th>Key</th><th>Label</th><th>Handler</th><th>Roles</th><th>Aktif</th><th></th></tr></thead><tbody>'+state.menuRows.map((r,i)=>'<tr><td>'+esc(r.key)+'</td><td>'+esc(r.label)+'</td><td><code>'+esc(r.handler)+'</code></td><td>'+esc(r.roles)+'</td><td>'+esc(r.active)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editMenu('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}
function editMenu(i){const r=i<0?{}:(state.menuRows[i]||{});const fs=['id','key','label','icon','handler','urutan','roles','active','config_json'];document.getElementById('menuModalBody').innerHTML=fs.map(f=>'<div class="mb-2"><label class="form-label small">'+f+'</label><input class="form-control" data-mf="'+f+'" value="'+esc(r[f]??'')+'"></div>').join('');new bootstrap.Modal(document.getElementById('menuModal')).show()}
async function saveMenu(){const d={};document.querySelectorAll('#menuModal [data-mf]').forEach(x=>d[x.dataset.mf]=x.value);d.active=String(d.active).toLowerCase()!=='false';try{await gas('saveMenu',d);bootstrap.Modal.getInstance(document.getElementById('menuModal'))?.hide();await renderMenuBuilder()}catch(e){alert('Gagal menyimpan menu: '+errorText(e))}}
async function renderClassAdmin(){try{const cls=await gas('getMyClass');const rows=await gas('getMyStudents');state.studentRows=Array.isArray(rows)?rows:[];document.getElementById('page').innerHTML='<div class="card"><div class="card-header"><h5 class="mb-0">Kelola Kelas</h5></div><div class="card-body"><div class="mb-3"><b>'+esc(cls?.nama||'Kelas')+'</b><div class="text-muted small">Sheet: '+esc(cls?.sheet_name||'-')+'</div></div><button class="btn btn-success mb-3" onclick="editStudent(-1)">+ Tambah Siswa</button><div class="table-wrap"><table class="table"><thead><tr><th>NISN</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody>'+state.studentRows.map((r,i)=>'<tr><td>'+esc(r.nisn)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.status)+'</td><td><button class="btn btn-sm btn-outline-primary" onclick="editStudent('+i+')">Edit</button></td></tr>').join('')+'</tbody></table></div></div></div>'}catch(e){document.getElementById('page').innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}}
function editStudent(i){const r=i<0?{kelas_id:state.session.kelas_id,status:'AKTIF'}:(state.studentRows[i]||{});document.getElementById('studentModalBody').innerHTML='<input type="hidden" data-sf="id" value="'+esc(r.id||'')+'"><div class="mb-2"><label class="form-label">NISN</label><input class="form-control" data-sf="nisn" value="'+esc(r.nisn||'')+'"></div><div class="mb-2"><label class="form-label">Nama</label><input class="form-control" data-sf="nama" value="'+esc(r.nama||'')+'"></div><input type="hidden" data-sf="kelas_id" value="'+esc(state.session.kelas_id||r.kelas_id||'')+'"><div class="mb-2"><label class="form-label">Status</label><select class="form-select" data-sf="status"><option '+(String(r.status||'AKTIF')==='AKTIF'?'selected':'')+'>AKTIF</option><option '+(String(r.status||'')==='NONAKTIF'?'selected':'')+'>NONAKTIF</option></select></div>';new bootstrap.Modal(document.getElementById('studentModal')).show()}
async function saveStudent(){const d={};document.querySelectorAll('#studentModal [data-sf]').forEach(x=>d[x.dataset.sf]=x.value);try{await gas('saveMyStudent',d);bootstrap.Modal.getInstance(document.getElementById('studentModal'))?.hide();await renderClassAdmin()}catch(e){alert('Gagal menyimpan siswa: '+errorText(e))}}
boot();
</script>
</body></html>
