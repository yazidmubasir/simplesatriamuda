<script>
(function(){
  window.renderActivitySheets = async function(){
    const box=document.getElementById('sheetArea');
    if(!box)return;
    box.innerHTML='<div class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Membaca daftar sheet...</div>';
    try{
      const x=await gas('getClassSpreadsheetSheets',state.builder.kelasId);
      const sheets=Array.isArray(x?.sheets)?x.sheets:[];
      box.innerHTML='<div class="builder-help mb-3"><div class="d-flex flex-wrap justify-content-between align-items-start gap-2"><div><b>2. Kelola sheet kegiatan</b><br><small>Sheet kegiatan berada di dalam Spreadsheet Kelas. Sebelum membuat kolom, OWNER dapat membuat sheet baru dan menentukan namanya melalui frontend.</small></div><button class="btn btn-success btn-sm" onclick="openCreateActivitySheet()"><i class="bi bi-plus-lg me-1"></i>Tambah Sheet</button></div></div>'+
        '<div class="row g-2">'+(sheets.length?sheets.map(s=>'<div class="col-md-6 col-xl-4"><button class="btn btn-outline-success w-100 text-start p-3" onclick="openActivitySheet(\''+esc(s.name).replace(/'/g,"\\'")+'\')"><b>'+esc(s.name)+'</b><small class="d-block text-muted">'+Number(s.rows||0)+' baris · '+Number(s.columns||0)+' kolom</small></button></div>').join(''):'<div class="col-12"><div class="text-center text-muted border rounded-3 p-4">Belum ada sheet kegiatan.</div></div>')+'</div><div id="builderEditor" class="mt-4"></div>';
    }catch(e){box.innerHTML='<div class="alert alert-danger">'+esc(errorText(e))+'</div>'}
  };
  window.openCreateActivitySheet=function(){
    let m=document.getElementById('createSheetModal');
    if(!m){
      m=document.createElement('div');m.id='createSheetModal';m.className='modal fade';m.tabIndex=-1;
      m.innerHTML='<div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Tambah Sheet Kegiatan</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="builder-help mb-3"><b>Nama Sheet</b><br><small>Gunakan nama yang jelas, misalnya <code>TRX_7KAIH</code>, <code>TRX_PRESENSI</code>, atau <code>TRX_PRESTASI</code>. Maksimal 90 karakter dan tidak boleh memakai <code>/ \\ ? * [ ] :</code>.</small></div><label class="form-label fw-semibold">Nama sheet</label><input id="newActivitySheetName" class="form-control" maxlength="90" placeholder="Contoh: TRX_7KAIH"><div id="newActivitySheetError" class="text-danger small mt-2"></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button><button id="createActivitySheetBtn" class="btn btn-success" onclick="createActivitySheetUI()">Buat Sheet</button></div></div></div>';
      document.body.appendChild(m);
    }
    document.getElementById('newActivitySheetName').value='';
    document.getElementById('newActivitySheetError').textContent='';
    bootstrap.Modal.getOrCreateInstance(m).show();
    setTimeout(()=>document.getElementById('newActivitySheetName')?.focus(),250);
  };
  window.createActivitySheetUI=async function(){
    const input=document.getElementById('newActivitySheetName'),btn=document.getElementById('createActivitySheetBtn'),err=document.getElementById('newActivitySheetError');
    const name=String(input?.value||'').trim();err.textContent='';
    if(!name){err.textContent='Nama sheet wajib diisi.';input?.focus();return;}
    if(name.length>90){err.textContent='Nama sheet maksimal 90 karakter.';return;}
    if(/[\\/?*\[\]:]/.test(name)){err.textContent='Nama sheet mengandung karakter yang tidak diperbolehkan.';return;}
    btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Membuat...';
    try{
      const r=await gas('createActivitySheet',state.builder.kelasId,name);
      if(!r?.ok)throw new Error(r?.message||'Sheet gagal dibuat.');
      bootstrap.Modal.getInstance(document.getElementById('createSheetModal'))?.hide();
      await renderActivitySheets();
      await openActivitySheet(name);
    }catch(e){err.textContent=errorText(e)}finally{btn.disabled=false;btn.innerHTML='Buat Sheet';}
  };

  /* MASTER KELAS: only spreadsheet, admin and status. Sheet names belong to the class spreadsheet. */
  masterMeta.KELAS.cols=['spreadsheet_id','admin_user_id','status'];

  /* OWNER -> MASTER USERS: ADMIN_KELAS username comes from MASTER_KELAS.admin_user_id. */
  let adminUsernameOptions=null;
  async function getAdminUsernameOptions(){
    if(Array.isArray(adminUsernameOptions))return adminUsernameOptions;
    const rows=await gas('getMasterRows','KELAS');
    const seen=new Set();
    adminUsernameOptions=(Array.isArray(rows)?rows:[])
      .filter(r=>String(r?.status||'AKTIF').toUpperCase()!=='NONAKTIF')
      .map(r=>String(r?.admin_user_id||'').trim().toLowerCase())
      .filter(v=>v&&!seen.has(v)&&seen.add(v));
    return adminUsernameOptions;
  }
  function currentUsernameValue(){return String(document.querySelector('#dataModalBody [data-f="username"]')?.value||'').trim();}
  async function syncAdminUsernameField(){
    const role=String(document.getElementById('userRole')?.value||'').toUpperCase();
    const old=document.querySelector('#dataModalBody [data-f="username"]');
    if(!old)return;
    const value=currentUsernameValue();
    if(role!=='ADMIN_KELAS'){
      if(old.tagName==='SELECT'){
        const input=document.createElement('input');
        input.type='text';input.className='form-control';input.dataset.f='username';input.value=value;input.autocomplete='off';
        old.replaceWith(input);
      }
      return;
    }
    const options=await getAdminUsernameOptions();
    if(old.tagName==='SELECT'){
      old.innerHTML='<option value="">Pilih Admin Kelas</option>'+(options.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join(''));
      old.value=options.includes(value.toLowerCase())?value.toLowerCase():'';
      old.disabled=options.length===0;
      return;
    }
    const select=document.createElement('select');
    select.className='form-select';select.dataset.f='username';select.id='adminClassUsername';
    select.innerHTML='<option value="">'+(options.length?'Pilih Admin Kelas':'Belum ada admin_user_id di MASTER_KELAS')+'</option>'+(options.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join(''));
    select.value=options.includes(value.toLowerCase())?value.toLowerCase():'';
    select.disabled=options.length===0;
    old.replaceWith(select);
  }
  const _openUserModal=window.openUserModal;
  if(typeof _openUserModal==='function'){
    window.openUserModal=async function(){
      const result=await _openUserModal.apply(this,arguments);
      try{await syncAdminUsernameField();}catch(e){console.debug('ADMIN_KELAS username dropdown:',e)}
      return result;
    };
  }
  const _refreshUserRoleFields=window.refreshUserRoleFields;
  if(typeof _refreshUserRoleFields==='function'){
    window.refreshUserRoleFields=async function(){
      const result=await _refreshUserRoleFields.apply(this,arguments);
      try{await syncAdminUsernameField();}catch(e){console.debug('ADMIN_KELAS username dropdown:',e)}
      return result;
    };
  }

  const _saveMaster=window.saveMaster;
  window.saveMaster=async function(){
    if(state.entity!=='KELAS')return _saveMaster();
    const modal=document.getElementById('dataModal'),btn=document.getElementById('dataSaveBtn'),d={};
    modal.querySelectorAll('[data-f]').forEach(x=>{d[x.dataset.f]=x.value});
    if(!String(d.spreadsheet_id||'').trim())return alert('ID Spreadsheet Kelas wajib diisi.');
    btn.disabled=true;
    try{
      const r=await gas('saveKelasConfig',d);
      if(!r?.ok)throw new Error(r?.message||'Gagal menyimpan konfigurasi kelas.');
      bootstrap.Modal.getInstance(modal)?.hide();
      state.kelasOptions=null;
      await loadMaster();
    }catch(e){alert('Gagal menyimpan: '+errorText(e))}finally{btn.disabled=false}
  };
})();
</script>
